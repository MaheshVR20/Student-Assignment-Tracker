name: Student Tracker Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
       uses: actions/checkout@v5

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
